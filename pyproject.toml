[project]
name = "chemical-safety-rag-assistant"
version = "3.0.0"
description = "Grounded, cited answers from chemical Safety Data Sheets with a local LLM."
requires-python = ">=3.11"

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["venv", "storage"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = [
    "RUF001",  # ambiguous unicode in strings (°, –, ≥ are intentional in SDS text)
    "RUF002",
    "RUF003",
    "SIM905",  # str.split() word lists read better than long list literals
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011", "E501"]  # fixtures quote long lines of real SDS text
"rag/prompts.py" = ["E501"]  # prompt text is easier to review unwrapped

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
markers = [
    "slow: loads real embedding models or the full bundled corpus",
    "live: requires a running Ollama server with the configured model",
]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
warn_unused_ignores = true
check_untyped_defs = true
files = ["rag", "ui", "ingest.py", "app.py", "scripts"]
