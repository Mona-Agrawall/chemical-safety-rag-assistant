name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies (CPU-only torch)
        run: |
          pip install --extra-index-url https://download.pytorch.org/whl/cpu -r requirements.lock
          pip install pytest==8.4.2 ruff==0.13.3 mypy==1.18.2
      - name: Lint
        run: ruff check .
      - name: Type check
        run: mypy
      - name: Tests (no live LLM)
        run: pytest -m "not live"
